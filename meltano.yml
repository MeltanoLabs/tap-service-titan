send_anonymous_usage_stats: false
requires_meltano: '>=4.0'
project_id: tap-service-titan
default_environment: test
venv:
  backend: uv
environments:
- name: test
plugins:
  extractors:
  - name: tap-service-titan
    namespace: tap_service_titan
    executable: .venv/bin/tap-service-titan
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings:
    - name: client_id
      kind: string
      sensitive: true
    - name: client_secret
      kind: string
      sensitive: true
    - name: st_app_key
      kind: string
      sensitive: true
    - name: tenant_id
      kind: string
    - name: api_url
      kind: options
      value: https://api.servicetitan.io
      description: The URL for the ServiceTitan API
      options:
      - label: Production
        value: https://api.servicetitan.io
      - label: Integration
        value: https://api-integration.servicetitan.io
    - name: auth_url
      kind: options
      value: https://auth.servicetitan.io/connect/token
      description: The URL for the ServiceTitan OAuth API
      options:
      - label: Production
        value: https://auth.servicetitan.io/connect/token
      - label: Integration
        value: https://auth-integration.servicetitan.io/connect/token
    - name: start_date
      kind: date_iso8601
      description: The start date-time for incremental streams
      value: 2026-01-01T00:00:00Z
    - name: capacities_business_unit_ids
      kind: array
      description: Business unit IDs to request availability for in the `capacities` stream. When omitted, availabilities for standalone business units may be missing.
    - name: capacities_lookahead_days
      kind: integer
      description: The number of days to look ahead for capacity availability.
      value: 14
    config:
      api_url: https://api-integration.servicetitan.io
      auth_url: https://auth-integration.servicetitan.io/connect/token
    select:
    - '*.*'
    - '!job_history.*'
    - '!capacities.*'
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
  - name: target-duckdb
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/target-duckdb.git@main
    config:
      primary_key_required: false
  - name: target-csv
    variant: meltanolabs
    pip_url: meltanolabs-target-csv
